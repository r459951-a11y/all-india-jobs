<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment - India Career Hub</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f4f7fb;
margin:0;
padding:0;
}

.container{
max-width:500px;
margin:30px auto;
background:#fff;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.2);
text-align:center;
}

h1{
color:#0d47a1;
}

.amount{
font-size:40px;
color:red;
font-weight:bold;
margin:15px 0;
}

img{
width:280px;
max-width:100%;
border:1px solid #ddd;
border-radius:8px;
}

input{
width:100%;
padding:12px;
margin-top:15px;
border:1px solid #ccc;
border-radius:6px;
box-sizing:border-box;
}

button{
width:100%;
padding:14px;
margin-top:15px;
background:#28a745;
color:#fff;
border:none;
border-radius:6px;
font-size:18px;
cursor:pointer;
}

.support{
margin-top:20px;
font-weight:bold;
}
</style>

</head>

<body>

<div class="container">

<h1>🇮🇳 India Career Hub</h1>

<p>Please pay the registration fee</p>

<div class="amount">₹200</div>

<!-- QR Image -->
<img src="qr.png" alt="QR Code">

<p>Scan the QR code and pay ₹200.</p>

<input type="text" placeholder="Enter Transaction ID">

<button onclick="alert('Payment details submitted successfully!')">
Submit Payment
</button>

<div class="support">
Customer Support<br>
📞 7494005371
</div>

</div>

</body>
</html>
