<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Candidate Registration - India Career Hub</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f4f7fb;
    margin:0;
}
.container{
    width:90%;
    max-width:500px;
    margin:30px auto;
    background:#fff;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.2);
}
h2{
    text-align:center;
    color:#0d47a1;
}
input,select{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:6px;
    box-sizing:border-box;
}
button{
    width:100%;
    padding:14px;
    background:#0d47a1;
    color:#fff;
    border:none;
    border-radius:6px;
    font-size:16px;
}
.note{
    text-align:center;
    color:red;
    font-weight:bold;
}
</style>

</head>
<body>

<div class="container">

<h2>🇮🇳 India Career Hub</h2>

<p class="note">Registration Fee ₹200</p>

<input type="text" placeholder="Full Name" required>

<input type="tel" placeholder="Mobile Number" required>

<input type="email" placeholder="Email Address">

<select>
<option>Select Qualification</option>
<option>10th</option>
<option>12th</option>
<option>Graduate</option>
<option>Post Graduate</option>
</select>

<input type="text" placeholder="State">

<label>Upload Resume</label>
<input type="file">

<input type="text" placeholder="Transaction ID">

<button onclick="location.href='payment.html'">
Continue to Payment
</button>

</div>

</body>
</html>
